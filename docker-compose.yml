# ============================================================
#  Hermes — Plataforma de Processamento Financeiro B2B
#  Stack: .NET 9 · Hermes Agent (Nous Research) · React · pgvector
# ============================================================

x-net-common: &net-common
  restart: unless-stopped
  networks:
    - hermes-net

services:

  # ============================================================
  # INFRAESTRUTURA
  # ============================================================

  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: hermes_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hermes_db
    ports:
      - "5432:5432"
    volumes:
      - hermes_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    <<: *net-common

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: hermes_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"   # Management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    <<: *net-common

  redis:
    image: redis:7.2-alpine
    container_name: hermes_redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    <<: *net-common

  # ============================================================
  # MOTOR QWEN3 (Usando Ollama como host)
  # ============================================================
  qwen-engine:
    image: ollama/ollama:latest
    container_name: hermes_qwen_engine
    ports:
      - "11434:11434"
    volumes:
      - hermes_qwen_data:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "24h"
    entrypoint: ["ollama", "serve"]
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    <<: *net-common

  qwen-puller:
    image: curlimages/curl:latest
    container_name: hermes_qwen_puller
    depends_on:
      qwen-engine:
        condition: service_healthy
    command: >
      sh -c "echo 'Iniciando download do Qwen 3 (qwen2.5)... Isso pode demorar!' && 
             curl -X POST http://qwen-engine:11434/api/pull -d '{\"name\": \"qwen2.5\"}' -s && 
             echo 'Download concluído!'"
    <<: *net-common

  # ============================================================
  # HERMES AGENT (Nous Research) — Motor de IA Autónomo
  # Monitoriza email, extrai faturas e comunica com o .NET Gateway
  # ============================================================
  hermes-agent:
    build:
      context: ./hermes-agent
      dockerfile: Dockerfile
    container_name: hermes_agent
    working_dir: /app
    volumes:
      - ./hermes-agent:/app                          # config, skills, hooks
      - hermes_agent_data:/root/.hermes              # estado persistente do agente
    environment:
      # LLM — Ollama (serviço Docker interno)
      OLLAMA_HOST: "http://qwen-engine:11434"
      
      # Integration — Gateway .NET
      HERMES_DOTNET_GATEWAY_URL: "http://hermes-gateway:8080"
      HERMES_DOTNET_API_KEY: "${HERMES_AGENT_API_KEY}"
      
      # MCP Server — .NET Gateway
      HERMES_MCP_URL: "http://hermes-gateway:8080/mcp"
      HERMES_MCP_KEY: "${HERMES_MCP_KEY}"
      
      # Email Inbox (se for lidar com IMAP/SMTP via environment ou config.yaml)
      FINANCE_EMAIL_ADDRESS: "${FINANCE_EMAIL_ADDRESS}"
      FINANCE_EMAIL_APP_PASSWORD: "${FINANCE_EMAIL_APP_PASSWORD}"
      FINANCE_IMAP_HOST: "${FINANCE_IMAP_HOST}"
      FINANCE_SMTP_HOST: "${FINANCE_SMTP_HOST}"
      
      # API Server do próprio agente
      API_SERVER_ENABLED: "true"
      API_SERVER_KEY: "${HERMES_API_SERVER_KEY}"
      HERMES_API_SERVER_KEY: "${HERMES_API_SERVER_KEY}"
      API_SERVER_CORS_ORIGINS: "http://hermes-gateway:8080"
      
      # WhatsApp — Baileys bridge (built-in ao Hermes Agent)
      WHATSAPP_ENABLED: "true"
      WHATSAPP_MODE: "bot"
      WHATSAPP_ALLOW_ALL_USERS: "true"
    ports:
      - "8642:8642"   # API Server (status, sessions, chat)
    depends_on:
      qwen-engine:
        condition: service_healthy
      hermes-gateway:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8642/health -H 'Authorization: Bearer ${HERMES_API_SERVER_KEY}' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    <<: *net-common

  # ============================================================
  # WHATSAPP BRIDGE (Baileys Node.js)
  # ============================================================
  baileys-bridge:
    build:
      context: ./baileys-bridge
    container_name: hermes_whatsapp_bridge
    environment:
      # URL for the bridge to send incoming files (e.g. to the python agent or gateway)
      BACKEND_URL: "http://hermes-agent:8642"
    ports:
      - "3001:3001"
    volumes:
      - hermes_whatsapp_data:/app/auth_sessions
    restart: unless-stopped
    networks:
      - hermes-net

  # ============================================================
  # CORE SERVICES (.NET 9)
  # ============================================================

  hermes-identity:
    build:
      context: ./Hermes
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: Hermes.Identity
    container_name: hermes_identity
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=hermes_db;Username=postgres;Password=postgres"
      Jwt__SecretKey: "HermesSecretKey_ChangeInProduction_MinimumLength32Chars"
      Jwt__Issuer: "Hermes.Identity"
      Jwt__Audience: "Hermes.Clients"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    <<: *net-common

  hermes-gateway:
    build:
      context: ./Hermes
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: Hermes.Gateway
    container_name: hermes_gateway
    ports:
      - "5000:8080"   # Porta pública — React + YARP + API REST
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=hermes_db;Username=postgres;Password=postgres"

      # Hermes Agent — proxy bidirecional
      HermesAgent__BaseUrl: "http://hermes-agent:8642"
      HermesAgent__ApiKey: "${HERMES_API_SERVER_KEY}"

      # Chave para o Hermes Agent fazer POST de faturas
      HERMES_AGENT_API_KEY: "${HERMES_AGENT_API_KEY}"

      # MCP
      HERMES_MCP_KEY: "${HERMES_MCP_KEY}"

      # YARP routes internas
      ReverseProxy__Clusters__hermes-identity__Destinations__destination1__Address: "http://hermes-identity:8080/"
      ReverseProxy__Clusters__hermes-services__Destinations__destination1__Address: "http://hermes-extraction:8080/"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      hermes-identity:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    <<: *net-common

  hermes-extraction:
    build:
      context: ./Hermes
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: Hermes.Extraction
    container_name: hermes_extraction
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      RabbitMQ__Host: rabbitmq
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=hermes_db;Username=postgres;Password=postgres"
      # Ollama para reprocessamento via Semantic Kernel
      Ollama__Endpoint: "http://qwen-engine:11434"
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    <<: *net-common

  hermes-reconciliation:
    build:
      context: ./Hermes
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: Hermes.Reconciliation
    container_name: hermes_reconciliation
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      RabbitMQ__Host: rabbitmq
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=hermes_db;Username=postgres;Password=postgres"
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    <<: *net-common

  hermes-notifications:
    build:
      context: ./Hermes
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: Hermes.Notifications
    container_name: hermes_notifications
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      RabbitMQ__Host: rabbitmq
      ConnectionStrings__Redis: redis:6379
      # Webhook outbound para parceiros B2B (SAP, Sage, etc.)
      Webhooks__RetryCount: "3"
      Webhooks__TimeoutSeconds: "30"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    <<: *net-common

  hermes-analytics:
    build:
      context: ./Hermes
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: Hermes.Analytics
    container_name: hermes_analytics
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      RabbitMQ__Host: rabbitmq
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=hermes_db;Username=postgres;Password=postgres"
      ConnectionStrings__Redis: redis:6379
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    <<: *net-common

  hermes-vector:
    build:
      context: ./Hermes
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: Hermes.Vector
    container_name: hermes_vector
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=hermes_db;Username=postgres;Password=postgres"
      Ollama__Endpoint: "http://qwen-engine:11434"
    depends_on:
      postgres:
        condition: service_healthy
      qwen-engine:
        condition: service_healthy
    <<: *net-common

  hermes-review-queue:
    build:
      context: ./Hermes
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: Hermes.ReviewQueue
    container_name: hermes_review_queue
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      RabbitMQ__Host: rabbitmq
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=hermes_db;Username=postgres;Password=postgres"
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    <<: *net-common

  # ============================================================
  # FRONTEND (React + Vite → Nginx)
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # .NET Gateway como backend
        VITE_API_URL: "http://localhost:5000/api/hermes"
    container_name: hermes_frontend
    ports:
      - "5173:80"
    depends_on:
      hermes-gateway:
        condition: service_healthy
    <<: *net-common

# ============================================================
# VOLUMES
# ============================================================
volumes:
  hermes_pg_data:
    driver: local
  hermes_qwen_data:
    driver: local
  hermes_agent_data:
    driver: local
  hermes_whatsapp_data:
    driver: local

# ============================================================
# NETWORKS
# ============================================================
networks:
  hermes-net:
    driver: bridge
