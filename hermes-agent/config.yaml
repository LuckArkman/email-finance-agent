# Hermes Agent — Email Finance Agent Configuration
# https://hermes-agent.nousresearch.com/docs/user-guide/configuration

# ------------------------------------------------------------
# LLM — Arquitetura Dual (Rápido + Preciso)
#
#  RÁPIDO  → qwen2.5:1.5b  (~986MB) — CPU, respostas em ~10s
#            Triagem de emails, resumos, respostas WhatsApp
#
#  PRECISO → qwen2.5:32b   (~19GB)  — GPU recomendada
#            Análise de faturas, reconciliação, decisões críticas
#            (também usável em CPU para máquinas sem GPU — só é lento)
#
# Controlo via .env:
#   HERMES_MODEL_DEFAULT=qwen2.5:1.5b   (padrão atual — CPU)
#   HERMES_MODEL_DEFAULT=qwen2.5:32b    (quando GPU disponível)
#   PULL_LARGE_MODEL=true               (para baixar o 32b)
# ------------------------------------------------------------
model:
  default: "qwen2.5-32k"
  base_url: "http://qwen-engine:11434/v1"
  api_key: "ollama"
  context_length: 131072

# ------------------------------------------------------------
# API Server — Para o .NET Gateway consultar status do agente
# ------------------------------------------------------------
api_server:
  enabled: true
  host: "0.0.0.0"
  port: 8642
  key: "${HERMES_API_SERVER_KEY}"
  cors_origins:
    - "http://localhost:5000"
    - "${HERMES_GATEWAY_URL}"

# ------------------------------------------------------------
# Gateway — Email Inbox (IMAP/SMTP) e WhatsApp
# ------------------------------------------------------------
gateway:
  email:
    enabled: true
    address: "${FINANCE_EMAIL_ADDRESS}"
    password: "${FINANCE_EMAIL_APP_PASSWORD}"
    imap_host: "${FINANCE_IMAP_HOST}"
    imap_port: 993
    imap_use_ssl: true
    smtp_host: "${FINANCE_SMTP_HOST}"
    smtp_port: 587
    smtp_use_tls: true
    poll_interval: 30

  whatsapp:
    enabled: true
    mode: bot
    unauthorized_dm_behavior: ignore
    reply_prefix: "⚕️ *Hermes Finance*\n──────\n"
    extra:
      text_batch_delay_seconds: 5.0
      text_batch_split_delay_seconds: 10.0

# ------------------------------------------------------------
# Toolsets — Habilitar apenas o necessário para faturas
# ------------------------------------------------------------
toolsets:
  - core
  - files
  - vision
  - web
  - memory
  - agent

# ------------------------------------------------------------
# MCP Servers — Hermes.Gateway .NET como servidor de ferramentas
# ------------------------------------------------------------
mcp_servers:
  hermes_dotnet:
    url: "${HERMES_GATEWAY_URL}/mcp"
    api_key: "${HERMES_MCP_KEY}"
    tools:
      - ingest_invoice
      - get_supplier_history
      - flag_for_review
      - get_pending_invoices

# ------------------------------------------------------------
# Memória — Persistência de conhecimento de fornecedores
# ------------------------------------------------------------
memory:
  auto_save: true
  consolidation_threshold: 5

providers:
  openai:
    request_timeout_seconds: 900
    stale_timeout_seconds: 900
  ollama:
    request_timeout_seconds: 900
    stale_timeout_seconds: 900
